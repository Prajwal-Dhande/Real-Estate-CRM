version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: estateiq-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: estateiq
    restart: unless-stopped
    networks:
      - estateiq-network

  redis:
    image: redis:7-alpine
    container_name: estateiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - estateiq-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  estateiq-network:
    driver: bridge
